# Publica el sitio desde main SIN archivos internos (docs, reglas, worker,
# skills, scripts). Requiere: Settings > Pages > Source = "GitHub Actions".
# Probar sin publicar:  bash .github/pages_filter.sh _site_prueba
name: Publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Revisar el sitio (preflight)
        run: python3 _scripts/preflight.py

      - name: Armar el sitio sin archivos internos
        run: bash .github/pages_filter.sh _site

      - uses: actions/configure-pages@v5

      # v3 a propósito: conserva archivos ocultos (.well-known/assetlinks.json
      # para la app de Play Store). v4 los quita.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # deploy-pages a veces se queda en "syncing_files" y vence a los 10 min
      # (lentitud de GitHub). Un reintento con el MISMO artefacto lo resuelve.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Esperar antes de reintentar
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
