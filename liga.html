<script>
(function () {
  var LG = window.VESPER_LEAGUE, UI = window.VESPER_LEAGUE_UI, host = document.getElementById("wlgHost");
  if (!LG || !LG.board || !UI) { document.getElementById("wlgTimer").textContent = "La liga no está disponible."; return; }
  var C = window.VESPER_LEAGUE_CLOUD, shown = null, tries = 0;
  /* la sesión de Firebase llega tarde: si en este aparato hubo una cuenta,
     se espera un poco antes de quedarse con la liga simulada */
  var hadAccount = !!(window.VesperCuenta && VesperCuenta.ns && VesperCuenta.ns());

  function paint(d, loading) {
    if (!d) return;
    if (!d.result && shown && d.mode !== "global") d.result = shown;
    UI.render(host, d, { tierArt: "assets/images/league/", loginHref: "login.html?next=liga.html", loading: loading });
    var go = host.querySelector("[data-drawer-go]");
    if (go) go.onclick = function () { location.href = "leccion.html?id=" + encodeURIComponent(go.getAttribute("data-drawer-go")); };
    if (loading) return;
    /* el resultado se marca visto cuando ya salió en la tabla definitiva */
    if (d.result && d.mode !== "global") {
      /* sin un toque previo en la página, Chrome bloquea sonido y vibración (y lo
         anota como error en la consola): sólo si ya hubo interacción */
      var act = navigator.userActivation;
      if (!shown && d.result.result === "up" && window.VESPER_SFX && (!act || act.hasBeenActive)) { try { VESPER_SFX.levelup(); } catch (e) {} }
      shown = d.result;
      try { LG.seenResult(); } catch (e) {}
    }
  }
  function run() {
    var settled = false;
    LG.board().then(function (d) {
      settled = true;
      var waitAuth = d && d.mode === "local" && hadAccount && C && C.available && C.available() && !C.signedIn();
      if (waitAuth && tries++ < 6) { paint(d, true); setTimeout(run, 500); return; }
      paint(d, false);
    }, function () { settled = true; if (LG.localBoard) paint(LG.localBoard(), false); });
    setTimeout(function () { if (!settled && LG.localBoard) paint(LG.localBoard(), true); }, 150);
  }
  run();
  setInterval(function () { UI.tick(host); }, 30000);
})();
</script>
