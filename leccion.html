<style>
:root{--ink:#1B1B2F;--gold:#c5a059;--cream:#f5f2eb;--paper:#ffffff;--muted:#6b6b76;--line:#ece7da}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cream);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;line-height:1.5;-webkit-text-size-adjust:100%}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{max-width:600px;margin:0 auto;padding:14px 16px 40px;min-height:100vh}
#install-btn{display:none}
.boot-shell .sk{display:block;border-radius:20px;--sk:color-mix(in srgb,var(--line) 50%,var(--cream));background:linear-gradient(100deg,var(--sk) 30%,color-mix(in srgb,var(--line) 80%,var(--paper)) 50%,var(--sk) 70%);background-size:300% 100%;animation:sk-shimmer 1.5s linear infinite}
.boot-shell .sk-hero{height:206px;margin:2px 0 12px}
.boot-shell .sk-card{height:184px;margin-bottom:14px}
.boot-shell .sk-path{display:flex;flex-direction:column;align-items:center;gap:30px;margin-top:30px}
.boot-shell .sk-node{width:64px;height:64px;border-radius:50%}
.boot-shell .sk-node:nth-child(2){transform:translateX(-52px)}
.boot-shell .sk-node:nth-child(3){transform:translateX(-14px)}
.boot-shell .sk-node:nth-child(4){transform:translateX(44px)}
@keyframes sk-shimmer{from{background-position:100% 0}to{background-position:0 0}}
@media(prefers-reduced-motion:reduce){.boot-shell .sk{animation:none}}
</style>
