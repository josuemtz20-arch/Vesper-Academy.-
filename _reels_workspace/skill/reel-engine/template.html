<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Inria Serif';font-weight:700;src:url('FONTDIR/InriaSerif-Bold.woff2') format('woff2');}
@font-face{font-family:'Caveat';font-weight:700;src:url('FONTDIR/Caveat-Bold.woff2') format('woff2');}
:root{--bg:#1B1B2F;--navy:#16163a;--gold:#C9A84C;--gold2:#E6CD82;--cream:#F4EEDC;--muted:#A9A6BF;--red:#FF6B6B;--red2:#E5484D;--green:#46B98A;--chalk:#F1EFE6;--slate:#1E2A4A;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:Inter,sans-serif;color:var(--cream)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:linear-gradient(180deg,#141432 0%,#1B1B2F 45%,#1d2147 100%)}
#violet{position:absolute;inset:0;background:linear-gradient(180deg,#151533 0%,#1f1b45 45%,#3B2A5C 78%,#4a2f6b 100%);opacity:0}
#stars{position:absolute;inset:0}
.star{position:absolute;border-radius:50%;background:#fff}
.spark{position:absolute;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,#fff6d0 0%,#E6CD82 35%,rgba(230,205,130,0) 70%);opacity:0}
#halo{position:absolute;width:980px;height:980px;left:50px;top:900px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,.30) 0%,rgba(201,168,76,.10) 38%,rgba(201,168,76,0) 66%)}
/* header (safe: y>=250) */
#hdr{position:absolute;top:262px;left:64px;right:130px;display:flex;justify-content:center;align-items:center;gap:18px;font-weight:700;font-size:26px;letter-spacing:.32em;color:var(--gold2)}
#hdr .lv{letter-spacing:.06em;border:2.5px solid var(--gold2);border-radius:999px;padding:4px 14px;font-size:24px}
/* stage */
.scene{position:absolute;left:64px;right:130px;top:330px;height:700px;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;text-align:center}
.serif{font-family:'Inria Serif',serif;font-weight:700}
.hand{font-family:'Caveat',cursive;font-weight:700}
.big{font-family:'Inria Serif',serif;font-weight:700;font-size:118px;line-height:1.05;color:var(--cream);position:relative;display:inline-block}
.big.md{font-size:96px}
.big .bad{color:var(--red)} .big .good{color:var(--gold2)}
.kick{font-family:'Inria Serif',serif;font-weight:700;font-style:italic;font-size:64px;color:var(--cream);margin-bottom:26px}
.anno{position:absolute;font-family:'Caveat',cursive;font-weight:700;font-size:58px;color:var(--gold2);white-space:nowrap}
.anno.red{color:var(--red)}
.ghost{visibility:hidden}
.caret{display:inline-block;position:relative;width:0;height:.9em;vertical-align:-.08em;visibility:hidden}
.caret::after{content:'';position:absolute;left:3px;top:0;width:.07em;min-width:5px;height:100%;background:var(--gold);border-radius:2px}
svg.ov{position:absolute;overflow:visible;pointer-events:none}
/* meeting window */
.win{width:840px;background:#1a1c3d;border:2px solid rgba(255,255,255,.12);border-radius:26px;box-shadow:0 30px 70px rgba(0,0,0,.45);overflow:hidden;text-align:left}
.win .bar{display:flex;align-items:center;gap:10px;padding:16px 22px;font-size:24px;font-weight:600;color:#cfd0e6}
.win .bar i{width:13px;height:13px;border-radius:50%;background:#4b4d6e;display:inline-block}
.win .bar span{margin-left:10px;flex:1}.win .bar b{font-weight:600;color:#9a9bb8}
.win .tile{position:relative;margin:0 18px 18px;height:430px;border-radius:18px;background:radial-gradient(circle at 50% 60%,#2b3170,#1a1d45 70%);overflow:hidden;border:4px solid transparent}
.win .tile.ok{border-color:var(--green)}
.win .tile img{position:absolute;left:50%;bottom:-50px;width:460px;transform:translateX(-50%)}
.win .tile .you{position:absolute;left:14px;bottom:12px;background:rgba(0,0,0,.55);color:#fff;font-size:22px;font-weight:700;padding:4px 12px;border-radius:8px}
.bubble{position:absolute;background:#FBF4E2;color:#1E3A8A;border-radius:22px;padding:14px 30px 18px;font-family:'Inria Serif',serif;font-weight:700;font-size:64px;box-shadow:0 14px 34px rgba(0,0,0,.4);border:3px solid var(--gold);white-space:nowrap}
.bubble::after{content:'';position:absolute;left:60px;bottom:-22px;border:14px solid transparent;border-top:18px solid #FBF4E2}
.bubble.bad{color:var(--red2)} .bubble.good{color:#1E3A8A}
/* chalkboard */
.board{position:relative;flex:none;width:930px;height:680px;background:radial-gradient(ellipse at 40% 30%,#2a3a63,#1b2747 75%);border:16px solid #A07C2E;border-radius:10px;box-shadow:inset 0 0 60px rgba(0,0,0,.45),0 26px 60px rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.board::after{content:'';position:absolute;left:-30px;right:-30px;bottom:-34px;height:18px;background:#8b6a25;border-radius:4px}
.board .lvl{position:absolute;right:26px;top:20px;font-family:'Caveat',cursive;font-weight:700;font-size:44px;color:var(--chalk);border:3px solid var(--chalk);border-radius:50%;padding:0 14px;opacity:.9}
.chalk{position:relative;font-family:'Caveat',cursive;font-weight:700;color:var(--chalk);font-size:104px;line-height:1.05;text-shadow:0 0 1px rgba(255,255,255,.5);white-space:nowrap}
.chalk.sm{font-size:70px;opacity:.85}
.chalk.md{font-size:90px}
.chalk.xs{font-size:64px;color:#E6CD82}
.chalk .g{color:var(--gold2)} .chalk .r{color:#ff8f8f}
.chalk u{text-decoration:none;position:relative}
.stick{position:absolute;width:22px;height:86px;background:linear-gradient(90deg,#e9e7df,#fff 45%,#d8d5cc);border-radius:5px 5px 3px 3px;transform-origin:50% 100%;transform:rotate(24deg);box-shadow:0 3px 8px rgba(0,0,0,.45);opacity:0;z-index:3;pointer-events:none}
.stick::after{content:'';position:absolute;left:0;right:0;bottom:-2px;height:10px;background:#cfccc2;border-radius:0 0 6px 6px}
/* notebook */
.paper{position:relative;flex:none;width:930px;padding:46px 50px 48px 110px;background:#FBF6E6;border-radius:6px;box-shadow:0 24px 50px rgba(0,0,0,.45);transform:rotate(-1.5deg);text-align:left;
  background-image:linear-gradient(transparent 0,transparent 98px,#c9d7ee 98px,#c9d7ee 100px);background-size:100% 100px;background-position:0 26px}
.paper::before{content:'';position:absolute;left:84px;top:0;bottom:0;width:3px;background:#e7a3a3}
.paper .tape{position:absolute;right:60px;top:-20px;width:150px;height:44px;background:rgba(240,215,140,.75);transform:rotate(4deg)}
.paper .row{position:relative;height:100px;display:flex;align-items:center;gap:16px;font-family:'Caveat',cursive;font-weight:700;font-size:70px;color:#22305c;white-space:nowrap}
.paper .row::before{content:'';position:absolute;left:-74px;width:18px;height:18px;border-radius:50%;background:#1d2340}
.paper .row .es{font-size:56px;color:#5d6178}
.paper .row.title{display:block;line-height:100px}
.paper .row .arr{color:var(--gold);font-size:52px}
.paper .row .en{color:#2350c4}
.paper .row .title{color:#1d2340}
.paper .row .title .g{color:#b8902f}
/* stamp */
.stamp{display:inline-block;border:6px solid var(--gold);color:var(--gold2);background:rgba(27,27,47,.75);font-weight:800;letter-spacing:.14em;font-size:62px;padding:8px 30px;border-radius:12px;transform:rotate(-8deg);box-shadow:0 0 0 4px rgba(201,168,76,.25)}
.check{width:96px;height:96px;border-radius:50%;background:var(--green);display:inline-flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(70,185,138,.4)}
.check svg{width:58px;height:58px}
.xbad{position:absolute;width:62px;height:62px;box-shadow:0 6px 18px rgba(229,72,77,.45);border-radius:50%;background:var(--red2);display:inline-flex;align-items:center;justify-content:center}
/* subtitles */
#sub{position:absolute;left:64px;right:130px;top:1036px;height:130px;display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:0 16px;font-weight:800;font-size:50px;letter-spacing:.05em;text-transform:uppercase;color:#fff;text-shadow:0 3px 14px rgba(0,0,0,.6);line-height:1.18}
#sub span{opacity:0}
#sub .g{color:var(--gold2)} #sub .r{color:var(--red)}
/* cat */
#catbox{position:absolute;width:900px;height:900px;left:90px;top:1080px}
#cat{position:absolute;inset:0;transform-origin:50% 100%}
#cat img{position:absolute;inset:0;width:100%;height:100%;opacity:0;object-fit:contain;object-position:50% 100%}
/* end */
.end .crest{width:170px;margin-bottom:28px}
.end h1{font-family:'Inria Serif',serif;font-weight:700;font-size:92px;line-height:1.02;color:var(--cream)}
.end h1 .g{color:var(--gold2)}
.end .btn{margin-top:34px;background:linear-gradient(#E6CD82,#C9A84C);color:#1B1B2F;font-weight:800;font-size:40px;padding:22px 54px;border-radius:999px;box-shadow:0 10px 0 #8b6a25,0 20px 40px rgba(0,0,0,.4)}
.eso{font-family:'Caveat',cursive;font-weight:700;font-size:120px;color:var(--green);text-shadow:0 4px 18px rgba(0,0,0,.5);transform:rotate(-6deg)}
#cam{position:absolute;inset:0;transform-origin:540px 1450px}
.end .slogan{margin-top:40px;font-family:'Inria Serif',serif;font-weight:700;font-size:56px;color:var(--gold2)}
</style></head>
<body><div id="stage">
<div id="violet"></div><div id="stars"></div><div id="halo"></div>
<div id="hdr"><span id="series"></span><span class="lv" id="lv"></span></div>
<div id="scenes"></div>
<div id="cam"><div id="catbox"><div id="cat"></div></div></div>
<div id="sub"></div>
</div>
<script>
const IMG='IMGDIR';
window.REEL=/*CONFIG*/null;
const T=window.TIMING, ENV=window.ENV||[], FPS=30, R=window.REEL;
const OKSVG='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const XSVG='<svg viewBox="0 0 24 24" width="34" height="34"><path d="M6 6l12 12M18 6L6 18" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/></svg>';
function tv(v){ if(typeof v==='number') return v; v=String(v).trim(); if(/^-?[\d.]+$/.test(v)) return parseFloat(v);
  let off=0; for(let mm;(mm=/([+-][\d.]+)$/.exec(v)) && /^[cL]\d+/.test(v.slice(0,mm.index));){ off+=parseFloat(mm[1]); v=v.slice(0,mm.index); }
  const m=/^[cL](\d+)(e|%[\d.]+)?$/.exec(v); if(!m) throw new Error('bad time '+v); const c=T.chunks[+m[1]];
  let b=c.start; if(m[2]==='e') b=c.end; else if(m[2]) b=c.start+parseFloat(m[2].slice(1))*(c.end-c.start); return b+off; }
function trange(v){ if(v.includes('~')){const [a,b]=v.split('~');return [tv(a),tv(b)];}
  const m=/^[cL](\d+)$/.exec(v); if(m){const c=T.chunks[+m[1]]; return [c.start-0.04, Math.max(c.start+0.3,c.end-0.1)];} const a=tv(v); return [a,a+0.6]; }
const cl=x=>Math.max(0,Math.min(1,x)), ease=p=>1-Math.pow(1-p,3), back=p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);};
function rng(s){return ()=>{s=(s*16807)%2147483647;return (s-1)/2147483646;};}
/* header */
document.getElementById('series').textContent=R.series||'ERROR TÍPICO'; document.getElementById('lv').textContent=R.level||'A2';
/* stars */
const sr=rng(7), starsEl=document.getElementById('stars'), stars=[];
for(let i=0;i<150;i++){ const d=document.createElement('div'); d.className='star'; const s=sr()<.85?1.6+sr()*1.6:3+sr()*2; d.style.width=d.style.height=s+'px';
  d.style.left=(sr()*1080)+'px'; d.style.top=(sr()*1500)+'px'; starsEl.appendChild(d); stars.push({el:d,b:.25+sr()*.5,f:.6+sr()*1.8,p:sr()*6.28}); }
const sparks=[[860,330],[180,520],[920,760]].map(([x,y],i)=>{const d=document.createElement('div');d.className='spark';d.style.left=x+'px';d.style.top=y+'px';starsEl.appendChild(d);return {el:d,p:i*1.7};});
/* scenes */
const host=document.getElementById('scenes');
const scenes=R.scenes.map(s=>{ const d=document.createElement('div'); d.className='scene '+(s.cls||'');
  d.innerHTML=s.html.replace(/\{IMG\}/g,IMG).replace(/\{OK\}/g,OKSVG).replace(/\{X\}/g,XSVG); host.appendChild(d);
  return {el:d,start:tv(s.start),end:s.end==='END'?1e9:tv(s.end)}; });
/* typewriter (data-type) */
const tws=[...document.querySelectorAll('[data-type]')].map(el=>{ const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT); const list=[]; let n; while(n=w.nextNode()) if(n.nodeValue.trim().length) list.push(n);
  const nodes=[]; let total=0; for(const tn of list){ const full=tn.nodeValue.replace(/\s+/g,' '); const sp=document.createElement('span'); const on=document.createElement('span'); const car=document.createElement('span'); car.className='caret'; const off=document.createElement('span'); off.className='ghost'; off.textContent=full;
    sp.append(on,car,off); tn.replaceWith(sp); nodes.push({full,on,off,car,o:total}); total+=full.length; }
  const [a,b]=trange(el.dataset.type); return {host:el,nodes,total,a,b,nocaret:el.hasAttribute('data-nocaret')}; });
/* hand / chalk reveal (left to right) */
const reveals=[...document.querySelectorAll('[data-hand],[data-chalk]')].map(el=>{ const chalk=el.hasAttribute('data-chalk'); const [a,b]=trange(el.dataset.hand||el.dataset.chalk);
  let stick=null; if(chalk){ stick=document.createElement('div'); stick.className='stick'; el.parentElement.appendChild(stick);} return {el,a,b,stick}; });
/* svg draw */
const draws=[...document.querySelectorAll('[data-draw]')].map(el=>{ const [a,b]=trange(el.dataset.draw); el.querySelectorAll('path,ellipse,line,polyline').forEach(p=>{p.setAttribute('pathLength','1');p.style.strokeDasharray='1';p.style.strokeDashoffset='1';}); return {el,a,b}; });
/* circles around words: <span data-circle="time" data-color="red"> */
const circles=[];
const items=[...document.querySelectorAll('[data-in]')].map(e=>({el:e,t:tv(e.dataset.in),a:e.dataset.anim||'rise'}));
const outs=[...document.querySelectorAll('[data-out]')].map(e=>({el:e,t:tv(e.dataset.out)}));
const stamps=[...document.querySelectorAll('[data-stamp]')].map(e=>({el:e,t:tv(e.dataset.stamp),r:parseFloat(e.dataset.rot||-8)}));
const strikes=[];
function afterType(w,a,b){ const host=w.closest('[data-type]'); const tw=host&&tws.find(x=>x.host===host); if(tw&&a<tw.b+0.08){ const d=tw.b+0.08-a; a+=d; b+=d; } return [a,b]; }
function setupCircles(){ document.querySelectorAll('[data-circle]').forEach(w=>{ const sc=w.closest('.scene'); const prevOp=sc.style.opacity; sc.style.opacity=1;
    const r=w.getBoundingClientRect(), sr=sc.getBoundingClientRect(); sc.style.opacity=prevOp;
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'); svg.setAttribute('class','ov'); const pad=22;
    svg.style.left=(r.left-sr.left-pad)+'px'; svg.style.top=(r.top-sr.top-pad*0.6)+'px'; svg.setAttribute('width',r.width+pad*2); svg.setAttribute('height',r.height+pad*1.2);
    const W=r.width+pad*2,H=r.height+pad*1.2, col=w.dataset.color==='gold'?'#E6CD82':'#FF6B6B';
    svg.innerHTML=`<path d="M ${W*0.55} ${H*0.06} C ${W*1.02} ${H*0.02}, ${W*1.03} ${H*0.95}, ${W*0.5} ${H*0.96} C ${W*-0.02} ${H*0.97}, ${W*-0.03} ${H*0.08}, ${W*0.62} ${H*0.12}" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1"/>`;
    sc.appendChild(svg); let [a,b]=trange(w.dataset.circle); [a,b]=afterType(w,a,b); circles.push({p:svg.querySelector('path'),a,b}); });
  document.querySelectorAll('[data-under]').forEach(w=>{ const sc=w.closest('.scene'); sc.style.opacity=1; const r=w.getBoundingClientRect(), sr=sc.getBoundingClientRect(); sc.style.opacity=0;
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'); svg.setAttribute('class','ov'); svg.style.left=(r.left-sr.left-6)+'px'; svg.style.top=(r.bottom-sr.top-10)+'px'; svg.setAttribute('width',r.width+12); svg.setAttribute('height',24);
    svg.innerHTML=`<path d="M 4 12 Q ${r.width*0.5} 22 ${r.width+8} 8" fill="none" stroke="#E6CD82" stroke-width="7" stroke-linecap="round" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1"/>`; sc.appendChild(svg);
    const [a,b]=trange(w.dataset.under); circles.push({p:svg.querySelector('path'),a,b}); });
  document.querySelectorAll('[data-strike]').forEach(w=>{ const sc=w.closest('.scene'); sc.style.opacity=1; const host=w.offsetParent||sc; const r=w.getBoundingClientRect(), hr=host.getBoundingClientRect(); sc.style.opacity=0;
    const col=w.dataset.color||'#FF6B6B'; const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'); svg.setAttribute('class','ov'); svg.style.left=(r.left-hr.left-10)+'px'; svg.style.top=(r.top-hr.top)+'px'; svg.setAttribute('width',r.width+20); svg.setAttribute('height',r.height);
    svg.innerHTML=`<path d="M 4 ${r.height*0.62} Q ${r.width*0.5} ${r.height*0.48} ${r.width+16} ${r.height*0.5}" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1"/>`; host.appendChild(svg);
    let [a,b]=trange(w.dataset.strike); [a,b]=afterType(w,a,b); circles.push({p:svg.querySelector('path'),a,b,svg});
    if(!w.hasAttribute('data-nox')){ const x=document.createElement('div'); x.className='xbad'; x.innerHTML=XSVG; x.style.left=(r.right-hr.left-8)+'px'; x.style.top=(r.top-hr.top-46)+'px'; host.appendChild(x); items.push({el:x,t:b-0.05,a:'pop'}); x.style.opacity=0; } });
  // a circle/underline/strike never starts before the text it marks has finished typing
  for(const c of circles){ c.svg=c.svg||c.p.ownerSVGElement; } }
/* subtitles */
const subEl=document.getElementById('sub'); const subs=[];
(R.lines||[]).forEach((ln,i)=>{ if(ln.lang!=='es'||ln.nosub) return; const c=T.chunks[i]; const words=(ln.sub||ln.text).split(/\s+/); const total=words.join('').length; let acc=0;
  const ws=words.map(w=>{ const t=c.start+(c.end-c.start)*0.92*(acc/total); acc+=w.length; const clean=w.replace(/[^\wáéíóúñü]/gi,'').toLowerCase();
    const cls=(R.gold||[]).includes(clean)?'g':((R.red||[]).includes(clean)?'r':''); return {w,t,cls}; });
  const next=T.chunks.slice(i+1).find((cc,k)=>R.lines[i+1+k]&&R.lines[i+1+k].lang==='es'&&!R.lines[i+1+k].nosub);
  subs.push({ws,start:c.start-0.05,end:Math.min(c.end+0.9,next?next.start-0.05:1e9),i}); });
let curSub=-1;
function renderSub(t){ const k=subs.findIndex(s=>t>=s.start&&t<s.end); if(k!==curSub){ curSub=k; subEl.innerHTML=''; if(k>=0) subs[k].ws.forEach(w=>{const s=document.createElement('span'); s.textContent=w.w; if(w.cls) s.className=w.cls; subEl.appendChild(s);}); }
  if(k>=0){ const s=subs[k]; const PG=Math.ceil(s.ws.length/Math.ceil(s.ws.length/7)); let pg=0; s.ws.forEach((w,j)=>{ if(j%PG===0 && t>=w.t-0.02) pg=Math.floor(j/PG); });
    [...subEl.children].forEach((el,j)=>{ const inPg=Math.floor(j/PG)===pg; const p=cl((t-s.ws[j].t)/.12); el.style.display=inPg?'':'none'; el.style.opacity=p; el.style.transform=`translateY(${(1-p)*10}px) scale(${.92+.08*p})`; }); } }
/* cat */
const catEl=document.getElementById('cat'); const IM={};
const CAT=(R.cat||[]).map(k=>({t:tv(k.t),pose:k.pose,g:k.g||''}));
function addImg(key,src){ if(IM[key]) return; const im=document.createElement('img'); im.src=src; catEl.appendChild(im); IM[key]=im; }
const DIR=p=>IMG+'/mascot/'+(p.startsWith('fb_')?'set_full':'set')+'/';
for(const k of CAT){ for(const s of ['closed','open','blink']) addImg(k.pose+'_'+s, DIR(k.pose)+k.pose+'_'+s+'.webp'); }
const BOX_BUST=Object.assign({left:90,top:1080,width:900,height:900},R.catbox||{}), BOX_FULL=Object.assign({left:280,top:1140,width:520,height:780},R.catboxFull||{});
let curBox=null; function setBox(full){ const b=full?BOX_FULL:BOX_BUST; if(curBox===b) return; curBox=b; const cb=document.getElementById('catbox'); for(const [k,v] of Object.entries(b)) cb.style[k]=v+'px'; }
// blink schedule
const br=rng(11); const blinks=[]; for(let t=1.2;t<80;t+=2.4+br()*2.2) blinks.push(t);
const isBlink=t=>!window.COVER && blinks.some(b=>t>=b&&t<b+0.13) || (R.endBlinkFrom!=null && t>=tv(R.endBlinkFrom));
function mouthOpen(t){ const f=Math.floor(t*FPS); return !!ENV[f]; }
function renderCat(t){
  if(!CAT.length) return; let i=0; for(let k=0;k<CAT.length;k++) if(CAT[k].t<=t) i=k;
  const cur=CAT[i], prev=i>0?CAT[i-1]:null, dt=t-cur.t; const f=prev?(dt>=0.08?1:0):1;

    const swap=prev&&(prev.pose.startsWith('fb_')!==cur.pose.startsWith('fb_'));
    let w = pose===cur.pose?(swap?1:f):(prev&&pose===prev.pose&&!swap?1-f:0);

}
/* camera: push-in on Vesper. R.zoom=[{t:'L2',d:1.2,s:1.14}] */
const ZOOM=(R.zoom||[]).map(z=>({t:tv(z.t),d:z.d||1.2,s:z.s||1.14})); const camEl=document.getElementById('cam');
function renderCam(t){ let k=0; for(const z of ZOOM){ const u=t-z.t; if(u<0||u>z.d) continue; const inn=ease(cl(u/0.28)), out=ease(cl((z.d-u)/0.4)); k=Math.max(k,(z.s-1)*Math.min(inn,out)); } camEl.style.transform=`scale(${1+k})`; return k; }
/* end card */
const endT=R.end!=null?tv(R.end):1e9;
window.render=function(t){

  const ve=cl((t-endT)/0.8); document.getElementById('violet').style.opacity=ve;
  sparks.forEach(s=>{ s.el.style.opacity=ve*(0.5+0.5*Math.sin(t*2.2+s.p)); s.el.style.transform=`scale(${0.8+0.5*Math.sin(t*2.2+s.p)})`; });

  document.getElementById('halo').style.transform=`scale(${1+0.03*Math.sin(t*1.3)})`;
  for(const s of scenes){ s.el.style.opacity=cl((t-s.start)/.18)*cl((s.end-t)/.16); s.el.style.transform=`translateY(${(1-ease(cl((t-s.start)/.3)))*24}px)`; }

    it.el.style.opacity=(it.a==='pop'?cl(p*3):e); it.el.style.transform= it.a==='pop'?`scale(${.6+.4*e})`: it.a==='fade'?'':`translateY(${(1-e)*30}px)`; }

  for(const w of tws){ const p=cl((t-w.a)/(w.b-w.a)); const k=Math.round(p*w.total); const typing=t>=w.a-0.15&&t<w.b, after=t>=w.b&&t<w.b+0.6, blink=Math.floor(t*3)%2===0;
    w.nodes.forEach((nd,j)=>{ const kk=Math.max(0,Math.min(nd.full.length,k-nd.o)); nd.on.textContent=nd.full.slice(0,kk); nd.off.textContent=nd.full.slice(kk);
      const last=j===w.nodes.length-1; const active=(k>=nd.o&&k<nd.o+nd.full.length)||(last&&k>=w.total)||(j===0&&k===0);

  for(const r of reveals){ const p=cl((t-r.a)/(r.b-r.a)); r.el.style.clipPath= p>=1?'none':`inset(-20% ${100-p*100}% -30% -5%)`;
    if(r.stick){ const w=r.el.offsetWidth, h=r.el.offsetHeight; r.stick.style.left=(r.el.offsetLeft+p*w-6)+'px'; r.stick.style.top=(r.el.offsetTop+h*0.62-86+Math.sin(t*38)*7)+'px'; r.stick.style.opacity=(!window.COVER&&t>=r.a-0.12&&t<r.b+0.2)?1:0; } }

  renderSub(t); renderCat(t); renderCam(t);
};
